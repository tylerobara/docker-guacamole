name: Build and push image
on:
  push:
    branches: [ "master" ]
    # Publish semver tags as releases.
    tags: [ '*.*.*' ]
  schedule:
      - cron: "59 23 * * 1"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: write
      security-events: write # upload SARIF scan results to the Security tab
      actions: read

    steps:
      - run: |
          echo "The job was automatically triggered by a ${{ github.event_name }} event."
          echo "This job is now running on a ${{ runner.os }} server hosted by github!"
          echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
            driver: docker-container
            buildkitd-flags: --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host
      
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Guacamole version
        id: guacver
        run: |
          VER=$(grep -m1 '^ARG GUAC_VER=' Dockerfile | cut -d= -f2)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "major=$(echo "$VER" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo "$VER" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.actor }}/guacamole
          # Version hierarchy like ghcr.io/rtvkiz/minimal-traefik:
          #   1.6.0-20261002  exact app version + build date (immutable)
          #   1.6.0           exact app version
          #   1.6             minor channel, gets patch releases
          #   1               major channel, gets minor + patch releases
          #   latest          always the newest build
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.guacver.outputs.version }}-{{date 'YYYYMMDD'}}
            type=raw,value=${{ steps.guacver.outputs.version }}
            type=raw,value=${{ steps.guacver.outputs.major_minor }}
            type=raw,value=${{ steps.guacver.outputs.major }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }} # Don't push on PR
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image
        id: scan
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.REGISTRY }}/${{ github.actor }}/guacamole
          fail-build: false

      # Upload the container scan results to the repo's Security tab
      # (Settings -> Code scanning alerts). Skipped on PRs since no image
      # is pushed there and the scan would evaluate the previous build.
      - name: upload Anchore scan SARIF report
        if: github.event_name != 'pull_request' && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: container-scan

      - name: Create version tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          VERSION=$(grep -m1 'ARG GUAC_VER=' Dockerfile | cut -d= -f2)
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "Tag $VERSION already exists, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "Created tag $VERSION"
          fi
